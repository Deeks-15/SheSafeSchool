name: Build SheSafe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Create lightweight assets
        run: |
          python -m pip install pillow
          python scripts/create_assets.py
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake gettext openjdk-17-jdk
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython<3" buildozer
      - name: Run backend tests
        run: |
          python -m pip install fastapi==0.99.1 pydantic==1.10.13 pytest
          pytest -q
      - name: Build debug APK
        run: |
          yes | buildozer android debug || buildozer android debug
      - name: Collect APK
        run: |
          mkdir -p artifact
          cp bin/*.apk artifact/SheSafeSchool-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SheSafeSchool-APK
          path: artifact/SheSafeSchool-debug.apk
          retention-days: 14
