name: Build SheSafe APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Create lightweight assets
        run: |
          python -m pip install pillow
          python scripts/create_assets.py
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev automake gettext openjdk-17-jdk
      - name: Install Buildozer toolchain
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer
          python -m pip install cython==0.29.34
          buildozer --version
          cython --version
      - name: Run backend tests
        run: |
          python -m pip install fastapi==0.99.1 pydantic==1.10.24 pytest
          pytest -q
      - name: Clean previous Android build
        run: |
          rm -rf .buildozer
      - name: Build debug APK
        run: |
          yes | buildozer android debug
      - name: Collect APK
        run: |
          mkdir -p artifact
          APK="$(find bin -maxdepth 1 -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" artifact/SheSafeSchool-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SheSafeSchool-APK
          path: artifact/SheSafeSchool-debug.apk
          retention-days: 14
